<!DOCTYPE html>
<html>
    <head>
        <title>Update Warden Salary</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="SignUp.css">
    </head>
    <body>
        <h1>Update Warden Salary</h1>
        <form action="#" method="post" autocomplete="off">
            <table>
                <tr>
                    <td><label for="warden_id">Warden ID:</label></td>
                    <td><input type="text" id="warden_id" name="warden_id" required></td>
                </tr>
                <tr>
                    <td><label for="warden_name">Warden Name:</label></td>
                    <td><input type="text" id="warden_name" name="warden_name" required></td>
                </tr>
                <tr>
                    <td><label for="current_salary">Current Salary:</label></td>
                    <td><input type="number" id="current_salary" name="current_salary" required></td>
                </tr>
                <tr>
                    <td><label for="new_salary">New Salary:</label></td>
                    <td><input type="number" id="new_salary" name="new_salary" required></td>
                </tr>
            </table>
            <a href="AdminPage.html"><input type="submit" value="Update Salary" style="width: 150px;" onclick="alert('Warden salary updated successfully')"></a>
        </form>
</html>
