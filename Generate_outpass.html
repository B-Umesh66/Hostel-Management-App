<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Warden Registration</title>
        <link rel="stylesheet" type="text/css" href="SignUp.css">
    </head>
    <body>
        <h1>Out Pass</h1>
        <form action="Generate_outpass" method="post" autocomplete="off">
            <table>
                <tr>
                    <td><label for="studentId">Student ID:</label></td>
                    <td><input type="text" id="studentId" name="studentId" required></td>
                </tr>
                <tr>
                    <td><label for="studentName">Student Name:</label></td>
                    <td><input type="text" id="studentName" name="studentName" required></td>
                </tr>
                <tr>
                    <td><label for="hostelName">Hostel Name:</label></td>
                    <td>
                        <input list="hostels" name="hostel" id="hostelName" placeholder="Select your hostel" required>
                        <datalist id="hostels">
                            <option value="Freshers Block">Freshers Block</option>
                            <option value="Aryabatta Block">Aryabatta Block</option>
                            <option value="Ratan Tata Block">Ratan Tata Block</option>
                            <option value="MSR Gowramma">MSR Gowramma</option>
                        </datalist>
                    </td>
                </tr>
                <tr>
                    <td><label for="roomNumber">Room Number:</label></td>
                    <td><input type="text" id="roomNumber" name="roomNumber" required></td>
                </tr>
                <tr>
                    <td><label for="reason">Reason for Out Pass:</label></td>
                    <td><input type="text" id="reason" name="reason" required></td>
                </tr>
                <tr>
                    <td><label for="fromDate">From Date:</label></td>
                    <td><input type="date" id="fromDate" name="fromDate" required></td>
                </tr>
                <tr>
                    <td><label for="toDate">To Date:</label></td>
                    <td><input type="date" id="toDate" name="toDate" required></td>
                </tr>
            </table>
            <input type="submit" value="Generate Out Pass" style="width: 200px;" onclick="alert('Request sent to Warden!..')">
        </form>
    </body>
</html>
