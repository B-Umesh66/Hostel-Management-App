<!DOCTYPE html>
<html>
<head>
    <title>Change Room</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Change Room Request</h1>
    <form action="{{ url_for('change_room_request') }}" method="post">
        <label for="new_room_no">New Room Number:</label>
        <input type="text" id="new_room_no" name="new_room_no" required><br><br>
        <label for="reason">Reason:</label><br>
        <textarea id="reason" name="reason" rows="4" cols="50" required></textarea><br><br>
        <button type="submit">Submit</button>
    </form>
    <div class="msg">{{ msg }}</div>
    <a href="{{ url_for('student_page') }}">Back to Home</a>
</body>
</html>
