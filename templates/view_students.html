<!DOCTYPE html>
<html>
<head>
    <title>View Students</title>
</head>
<body>
    <h1>All Students</h1>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Student ID</th>
                <th>Hostel</th>
                <th>Room No</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.id }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.email }}</td>
                <td>{{ student.student_id }}</td>
                <td>{{ student.hostel }}</td>
                <td>{{ student.room_no }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="{{ url_for('admin_page') }}">Back to Admin Page</a>
</body>
</html>
