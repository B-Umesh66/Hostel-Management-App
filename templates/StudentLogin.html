<!DOCTYPE html>
<html>
    <head>
        <title>Student Login</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='Login.css') }}">
    </head>
    <body>
        <h1>Student Login</h1>
        <form action="{{ url_for('student_login') }}" method="post">
            <input type="text" id="username" name="username" placeholder="Username" autocomplete="off" required><br><br>
            <input type="password" id="password" name="password" placeholder="Password" autocomplete="off" required><br><br>
            <button type="submit" class="submit">Login</button>
        </form>
        <div class="msg">{{ msg }}</div>
        <a class="newuser" href="{{ url_for('student_signup') }}">New User? Register Here</a>
    </body>
</html>
