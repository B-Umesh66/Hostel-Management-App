<!DOCTYPE html>
<html>
<head>
    <title>Outpass Generation</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Outpass Generation</h1>
    <form action="{{ url_for('generate_outpass') }}" method="post">
        <label for="reason">Reason:</label><br>
        <textarea id="reason" name="reason" rows="4" cols="50" required></textarea><br><br>
        <label for="from_date">From Date:</label>
        <input type="date" id="from_date" name="from_date" required><br><br>
        <label for="to_date">To Date:</label>
        <input type="date" id="to_date" name="to_date" required><br><br>
        <button type="submit">Generate</button>
    </form>
    <div class="msg">{{ msg }}</div>
    <a href="{{ url_for('student_page') }}">Back to Home</a>
</body>
</html>
