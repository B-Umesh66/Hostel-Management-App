<!DOCTYPE html>
<html>
    <head>
        <title>Change Hostel Request</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="SignUp.css">
    </head>
    <body>
        <h1>Change Room Request</h1>
        <form action="#" method="post" autocomplete="off">
            <table>
                <tr>
                    <td><label for="Studet_id">Student ID:</label></td>
                    <td><input type="text" id="student_id" name="student_id" required></td>
                </tr>
                <tr>
                    <td><label for="current_hostel">Current Hostel:</label></td>
                    <td>
                        <input list="hostels" name="current_hostel" id="current_hostel" placeholder="Select your hostel" required>
                        <datalist id="hostels">
                            <option value="Freshers Block">Freshers Block</option>
                            <option value="Aryabatta Block">Aryabatta Block</option>
                            <option value="Ratan Tata Block">Ratan Tata Block</option>
                            <option value="MSR Gowramma">MSR Gowramma</option>
                        </datalist>
                    </td>
                </tr>
                <tr>
                    <td><label for="requested_hostel">Requested Hostel:</label></td>
                    <td>
                        <input list="hostels" name="requested_hostel" id="requested_hostel" placeholder="Select your hostel" required>
                        <datalist id="hostels">
                            <option value="Freshers Block">Freshers Block</option>
                            <option value="Aryabatta Block">Aryabatta Block</option>
                            <option value="Ratan Tata Block">Ratan Tata Block</option>
                            <option value="MSR Gowramma">MSR Gowramma</option>
                        </datalist>
                    </td>
                </tr>
                <tr>
                    <td><label for="reason">Reason for Change:</label></td>
                    <td><textarea id="reason" name="reason" rows="4" cols="30" required></textarea></td>
                </tr>
            </table>
            <a href="StudentPage.html"><input type="submit" value="Submit Request" style="width: 150px;" onclick="alert('Request sent to admin')"></a>
        </form>
    </body>
</html>
